<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minipos | login</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/password-input.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div class="login-card">

        <div class="logo">
            MiniPOS
        </div>

        <div class="form-group">
            <label>Username</label>
            <input id="login-username" type="text" placeholder="Masukkan username">
        </div>

        <div id="password-area" class="form-group">
            <label>Password</label>
            <!-- inject password input here -->
        </div>

        <button id="btnLogin">
            Masuk
        </button>

        <p class="forgot-area">
            <a href="#" id="recoverAccountBtn">
                Lupa Username atau Password?
            </a>
        </p>

    </div>

    <script src="../js/toast.js"></script>
    <script src="../js/password_input.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/modal.js"></script>
</body>
</html>
