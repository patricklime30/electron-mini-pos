<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minipos | Produk</title>
    <link rel="stylesheet" href="../css/product.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/header.css">
</head>
<body>
    <div class="content">
        <!-- header here -->

        <div class="content-inner">

            <div class="page-header">
                <div>
                    <h1>Produk</h1>
                    <p>Kelola daftar produk yang tersedia</p>
                </div>

                <button id="btnAdd" class="btn-primary">+ Tambah Produk</button>
            </div>

            <div class="table-card">

                <table class="product-table">
                    <thead>
                        <tr>
                            <th>Gambar</th>
                            <th>Nama</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="productTable"></tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- product modal -->
    <div class="modal" id="productModal">

        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <h2 id="modalTitle">Tambah Produk</h2>
                    <p>Masukkan informasi produk di bawah ini.</p>
                </div>

                <button class="close-btn" id="closeProductModal">&times;</button>
            </div>

            <div class="modal-body">

                <div class="form-group">
                    <label>Nama produk</label>
                    <input
                        type="text"
                        id="productName"
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Harga</label>
                        <input
                            type="text"
                            id="productPrice"
                        >
                    </div>

                    <div class="form-group">
                        <label>Stok</label>
                        <input
                            type="number"
                            id="productStock"
                            placeholder="0"
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label>Gambar</label>
                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                    >
                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn-primary"
                    id="saveBtn">
                    Simpan Produk
                </button>

                <button
                    class="btn-secondary"
                    id="cancelProductBtn">
                    Batal
                </button>

            </div>

        </div>

    </div>

    <div class="modal" id="deleteModal">

        <div class="modal-content" style="width:400px">

            <div class="modal-header">
                <div>
                    <h2>Hapus Produk</h2>
                </div>

                <button class="close-btn" id="closeDeleteModal">&times;</button>
            </div>

            <div class="modal-body">
                <p style="color:#374151">
                    Apakah ingin menghapus produk ini?
                </p>
            </div>

            <div class="modal-footer">

                <button class="btn-secondary" id="cancelDeleteBtn">
                    Batal
                </button>

                <button class="btn-delete" id="confirmDeleteBtn">
                    Ya, hapus
                </button>

            </div>

        </div>

    </div>

    <script src="../js/toast.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/product.js"></script>
</body>
</html>
